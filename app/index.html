<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Révisions</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5fd0">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <script>
    // Thème et taille appliqués avant le premier affichage (pas d'éclair blanc en mode sombre).
    try {
      const r = JSON.parse(localStorage.getItem('revision.reglages')) || {};
      if (r.theme && r.theme !== 'auto') document.documentElement.dataset.theme = r.theme;
      if (r.taille) document.documentElement.style.setProperty('--taille-texte', r.taille + 'px');
    } catch {}
    // Nouvelle version de l'app : écouté dès le début de la page, car le navigateur peut
    // installer la nouvelle version avant que les modules JS ne soient chargés.
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.nouvelleVersion = true;
        window.dispatchEvent(new Event('nouvelle-version'));
      });
    }
  </script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/marked/marked.umd.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="accueil">
  <header class="barre">
    <a href="#/" class="barre-retour" id="retour" hidden aria-label="Retour">‹</a>
    <h1 id="titre">Révisions</h1>
    <button class="barre-bouton" id="bouton-reglages" aria-label="Réglages">Aa</button>
    <div class="progression" id="progression" hidden><span></span></div>
  </header>
  <div class="voile" id="voile" hidden></div>
  <div class="reglages" id="reglages" hidden role="dialog" aria-label="Réglages">
    <div class="poignee" aria-hidden="true"></div>
    <div id="reglages-choix"></div>
    <p class="etat-horsligne" id="etat-horsligne"></p>
  </div>
  <button class="installer" id="installer" hidden>📲 Installer l'app sur ce téléphone</button>
  <div class="reglages sommaire" id="sommaire" hidden role="dialog" aria-label="Sommaire du chapitre"></div>
  <main id="vue"></main>
  <nav class="bas" id="bas" hidden></nav>
</body>
</html>
